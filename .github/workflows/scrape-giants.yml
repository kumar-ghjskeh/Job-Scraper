name: Scrape giants (browser)

# Browser-based scraping for big-tech career SPAs (Apple, …) whose public APIs are
# protected/obfuscated. Installs Chromium on GitHub's runner and DOM-scrapes the
# rendered job listings (engine: browser companies). Kept SEPARATE from the main
# browserless scrape so a browser/bot-detection failure here never affects the
# reliable httpx + curl_cffi pass. Writes to the same production Postgres.
#
# Needs the same DATABASE_URL repo secret as the main scrape.

on:
  schedule:
    - cron: "30 */8 * * *"   # every 8 hours = 3/day (big-tech reqs change slowly;
                             # keeps the private-repo Actions budget comfortable)
  workflow_dispatch: {}       # manual "Run workflow" button (use this to test)

concurrency:
  group: scrape-giants
  cancel-in-progress: false

jobs:
  scrape-giants:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL repository secret is not set."
            exit 1
          fi

      # Split into separate steps so a setup failure names the exact stage that
      # broke (pip vs OS deps vs browser download vs launch) instead of one opaque
      # "install" failure.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-browser.txt

      - name: Install Chromium system libraries
        run: python -m playwright install-deps chromium

      - name: Install Chromium browser
        run: python -m playwright install chromium

      - name: Verify Chromium launches
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              print("Chromium OK:", b.version)
              b.close()
          PY

      - name: Run browser scraper (giants)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m backend.app.run_browser_scrape
