name: Scrape giants (browser)

# Browser-based scraping for big-tech career SPAs (Apple, Google, Meta, …) whose
# public APIs are protected/obfuscated. Installs Chromium on GitHub's runner and
# DOM-scrapes the rendered job listings (engine: browser companies). Kept SEPARATE
# from the main browserless scrape so a browser/bot-detection failure here never
# affects the reliable httpx + curl_cffi pass.
#
# Seeds from and republishes the same static snapshot as scrape.yml — there is no
# database. Needs NO secrets.
#
# ── History, so this isn't "improved" back into a hole ────────────────────────
# Aug 2026: every run failed in ~50s. It looked like a browser/runner problem and
# was briefly "fixed" by moving the job into the official Playwright container
# image. That was a misdiagnosis on both counts:
#   * the real cause was a ForeignKeyViolation in maintain_scrape_runs() that
#     aborted EVERY engine before any scraping (fixed in 6be4f52), and
#   * the container image keeps playwright in a venv that is not on the default
#     PATH, so `python -m playwright` was missing entirely.
# This setup is the one that demonstrably worked (3-4 min runs). What was kept
# from that attempt is the part that was actually worth keeping: pinned versions
# and an environment report.

on:
  schedule:
    - cron: "30 */8 * * *"   # every 8 hours = 3/day (big-tech reqs change slowly;
                             # keeps the private-repo Actions budget comfortable)
  workflow_dispatch: {}       # manual "Run workflow" button (use this to test)

# Shared with scrape.yml: both jobs commit the same snapshot files, so they must
# never run at the same time.
concurrency:
  group: snapshot-write
  cancel-in-progress: false

permissions:
  contents: write             # to commit the refreshed snapshot

jobs:
  scrape-giants:
    # Pinned, never `ubuntu-latest`: that label silently migrates between Ubuntu
    # LTS releases and the apt package names `playwright install-deps` needs
    # change across them. Bump this deliberately, not on GitHub's schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Pinned to a SHA, not a tag. v4 targets Node 20, which GitHub has
      # deprecated — the run logs already warn it is being forced onto Node 24.
      # When that shim is removed a floating tag would break every workflow at
      # once, which is exactly the class of surprise the dependency lock exists
      # to prevent. A SHA cannot move under us; bump it deliberately.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip

      # Prints the exact runtime this job got. When something upstream shifts,
      # this is the line that makes the next failure self-explaining instead of
      # a guessing game — it is what caught the missing module above.
      - name: Environment report
        run: |
          echo "OS:         $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "Python:     $(python --version 2>&1)"
          echo "Playwright: $(python -m playwright --version 2>&1 || echo 'not installed yet')"

      # Split into separate steps so a setup failure names the exact stage that
      # broke (pip vs OS deps vs browser download vs launch) instead of one opaque
      # "install" failure.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install from the LOCK, not the ranges. CI used to resolve fresh
          # versions on every run while local development stayed on older ones,
          # so a library could tighten behaviour and break the scrape with no
          # commit from us — and the same code still passed locally. That is the
          # "fails by itself every couple of weeks" loop. sqlmodel 0.0.38 (local)
          # vs 0.0.47 (CI) was the last one: it started rejecting naive datetimes
          # and killed every scrape for nine days.
          pip install -r backend/requirements.lock.txt
          pip install -r backend/requirements-browser.txt

      - name: Install Chromium system libraries
        run: python -m playwright install-deps chromium

      - name: Install Chromium browser
        run: python -m playwright install chromium

      - name: Verify Chromium launches
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              print("Chromium OK:", b.version)
              b.close()
          PY

      # Run the suite against the LOCKED stack BEFORE scraping. Nine days of
      # failures were a type error pytest catches in seconds, but nothing ran it,
      # so the first sign of trouble was a scheduled run dying at 03:00. Each of
      # these guards covers a class that has taken this app down before:
      #   datetime_awareness  naive vs aware timestamps (the nine-day outage)
      #   scrape_egress       scrape queries loading heavy description columns
      #   data_health         the health panel lying about pipeline state
      #   company_identity    a board token belonging to a DIFFERENT company
      #   h1b_filter          an unclassified company vanishing from the H1B view
      #   role_scope          backend/physical-design roles leaking into RTL+DV
      #   role_scope_strict   anything that is not RTL design or DV on the board
      #   snapshot_merge      one pass discarding the other pass's tallies/runs
      - name: Guard tests
        run: |
          pip install -q pytest
          python -m pytest -q \
            backend/tests/test_datetime_awareness.py \
            backend/tests/test_scrape_egress.py \
            backend/tests/test_data_health.py \
            backend/tests/test_company_identity.py \
            backend/tests/test_h1b_filter.py \
            backend/tests/test_role_scope.py \
            backend/tests/test_role_scope_strict.py \
            backend/tests/test_snapshot_merge.py

      - name: Scrape (browser) and rebuild the snapshot
        env:
          DATA_DIR: frontend/public/data
          STATIC_ENGINE: browser
        run: python -m backend.app.run_static

      # Audit the corpus this run just produced, BEFORE publishing it.
      #
      # The guard tests above run against code; this runs against the data, and
      # covers the classes that have actually broken here: a field exported but not
      # restored, the hidden-category set drifting between the four places that
      # decide what shows, a company with no H1B classification silently vanishing
      # from that view, duplicate fingerprints, naive timestamps, and retired rows
      # re-inflating the payload. Exits non-zero only on a real failure, so a
      # warning (a stalled source, say) still publishes.
      - name: Audit the corpus
        run: python scripts/audit_system.py

      - name: Publish the snapshot
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep this run's output aside, then publish by starting from whatever
          # is currently on the branch and merging our corpus into it. Rebase is
          # the wrong tool: both scrape workflows regenerate the same two JSON
          # files wholesale, so git can never auto-merge them and the rebase just
          # stops on a conflict. A plain overwrite is worse than that — the
          # browser pass only knows about 3 companies, so publishing it over a
          # full run would silently drop ~1,200 jobs.
          TMP=$(mktemp -d)
          cp frontend/public/data/jobs.json frontend/public/data/details.json "$TMP"/

          for attempt in 1 2 3; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --hard --quiet "origin/${GITHUB_REF_NAME}"
            # Working tree is now the published corpus; union it into ours.
            DATA_DIR="$TMP" python -m backend.app.merge_publish               frontend/public/data/jobs.json frontend/public/data/details.json
            cp "$TMP"/jobs.json "$TMP"/details.json frontend/public/data/

            git add frontend/public/data/jobs.json frontend/public/data/details.json
            if git diff --cached --quiet; then
              echo "Corpus unchanged — nothing to publish."
              exit 0
            fi
          # NOTE: do NOT add [skip ci] here. Vercel honours it and skips the
          # deploy, so the refreshed corpus would land in the repo but never
          # reach the CDN — the app would keep serving whatever was built last.
          # It is not needed to avoid re-triggering these workflows either:
          # neither runs on `push`, only on schedule and manual dispatch.
            COUNT=$(python -c "import json;print(json.load(open('frontend/public/data/jobs.json'))['count'])")
            git commit --quiet -m "data: refresh job snapshot (${COUNT} jobs), browser pass"
            if git push --quiet; then
              echo "Published ${COUNT} jobs."
              exit 0
            fi
            echo "Push race, retrying ($attempt)"
            sleep 5
          done
          echo "::error::Could not publish the snapshot after 3 attempts."
          exit 1
