name: Scrape giants (browser)

# Browser-based scraping for big-tech career SPAs (Apple, Google, Meta, …) whose
# public APIs are protected/obfuscated. DOM-scrapes the rendered job listings
# (engine: browser companies). Kept SEPARATE from the main browserless scrape so
# a browser/bot-detection failure here never affects the reliable httpx +
# curl_cffi pass. Writes to the same production Postgres.
#
# Needs the same DATABASE_URL repo secret as the main scrape.
#
# ── Why this job runs in a container ──────────────────────────────────────────
# It used to install Chromium onto a bare `ubuntu-latest` runner:
#     pip install playwright  (unpinned: ">=1.45.0")
#     playwright install-deps chromium     <- apt, OS-version sensitive
#     playwright install chromium          <- ~170MB download every run
# That chain has three moving parts NOBODY controls and any of them can start
# failing with zero commits on our side:
#   1. `ubuntu-latest` silently migrates between Ubuntu LTS releases, and
#      `install-deps` apt package names change across them.
#   2. An unpinned playwright resolves to whatever shipped that morning.
#   3. The browser download is a network fetch that can 404 or rate-limit.
#
# The official Playwright image ships Chromium AND its system libraries
# preinstalled, at a version fixed by the tag. No apt, no browser download, no
# `ubuntu-latest` drift. Pin this tag and the pin in requirements-browser.txt
# together — the Python package and the bundled browser must match.
# Container jobs are free on GitHub Actions, including on private repos.

on:
  schedule:
    - cron: "30 */8 * * *"   # every 8 hours = 3/day (big-tech reqs change slowly;
                             # keeps the private-repo Actions budget comfortable)
  workflow_dispatch: {}       # manual "Run workflow" button (use this to test)

concurrency:
  group: scrape-giants
  cancel-in-progress: false

jobs:
  scrape-giants:
    runs-on: ubuntu-24.04          # pinned, never `-latest`
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      # Prints the exact runtime this job got. When something upstream shifts,
      # this is the line that makes the next failure self-explaining instead of
      # a guessing game.
      - name: Environment report
        run: |
          echo "OS:        $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "Python:    $(python --version 2>&1)"
          echo "Playwright: $(python -m playwright --version 2>&1)"

      - name: Check DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL repository secret is not set."
            exit 1
          fi

      # playwright itself is already in the image at the pinned version; installing
      # requirements-browser.txt here would be a no-op at best and a version
      # conflict at worst, so only the app's own dependencies are installed.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Fails loudly and early if the image's browser is somehow unusable, so a
      # launch problem is never misreported as a scraping problem.
      - name: Verify Chromium launches
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              print("Chromium OK:", b.version)
              b.close()
          PY

      - name: Run browser scraper (giants)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m backend.app.run_browser_scrape
