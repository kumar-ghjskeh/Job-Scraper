  # ─────────────────────────────────────────────────────────────────────────
  #  DIRECTORY ENTRIES (added 2026-10-07)
  #
  #  RTL design / design-verification employers with no verified ATS endpoint
  #  yet, so they are enabled: false and are not scraped. They exist so the
  #  company directory is complete and every row carries a working careers
  #  link. Each URL was checked and answered before being added — a directory
  #  of dead links is worse than a shorter one.
  #
  #  Deliberately NOT here, on measured evidence rather than taste:
  #    Zoox          238 postings, 0 RTL/DV
  #    QuEra         79 postings, 0 RTL/DV
  #    Lam Research  10 postings, 0 RTL/DV (semiconductor equipment)
