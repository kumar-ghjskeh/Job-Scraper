# Render Blueprint — deploys the Job Scraper backend (FastAPI + APScheduler).
# The database is NEON (free, persistent Postgres) — NOT Render's free Postgres,
# which auto-deletes ~30 days after creation. Set DATABASE_URL in the Render
# dashboard to the Neon connection string. The frontend deploys separately to
# Vercel; scraping runs 24/7 in GitHub Actions writing straight to Neon.

services:
  - type: web
    name: job-scraper-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    # Install from the LOCK, exactly like CI. requirements.txt carries ranges, so
    # the old command resolved fresh versions on every deploy: a new minor of any
    # of 58 packages could land in a deploy with no commit from us, and the
    # failure then looked like "it broke by itself". The lock is a superset of
    # requirements.txt (psycopg2-binary, pymupdf, python-docx included) and is
    # resolved on the same Python 3.12 this service pins below.
    buildCommand: "pip install -r requirements.lock.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    # Only redeploy when the backend actually changes.
    #
    # Without this, every commit on main redeploys the API. The scrape workflows
    # commit a fresh snapshot 6x a day (plus the browser pass), so the real count
    # over the last seven days was 55 deploys, 44 of them for commits that touched
    # no backend file at all — data under frontend/public/data. Each one ran a full
    # pip install on a free instance and restarted the service, and any one of
    # them that hit a slow PyPI mirror or a cold database sent a "Deploy failed"
    # mail about code that had not changed since the last success.
    #
    # A deploy that never starts cannot fail. The data path needs no deploy: the
    # snapshot is served by Vercel from the repo, never by this API.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
      ignoredPaths:
        - frontend/**
        - config/**
        - scripts/**
        - .github/**
        - "**/*.md"
    envVars:
      - key: DATABASE_URL
        sync: false   # ← set to your NEON connection string in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://job-scraper-tau-teal.vercel.app
      # Scraping is external (GitHub Actions -> Neon), so the web service does NO
      # scraping: it's a lean read-only API. This keeps /health fast and avoids
      # Render's "health check timed out" emails caused by scrapes hogging the CPU.
      - key: RUN_SCRAPE_ON_STARTUP
        value: "false"
      - key: ENABLE_SCHEDULER
        value: "false"
      # Optional: VAPID private key enables Web Push saved-search alerts. The
      # public key ships in config; set this secret to the matching private key.
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Optional: free Google Gemini key enables Résumé Studio's in-app "Generate"
      # button. Without it, the copy-prompt (Claude/ChatGPT) flow still works.
      - key: GEMINI_API_KEY
        sync: false
